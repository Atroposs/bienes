<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto seguro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex w-full items-center justify-between gap-4 px-6 py-4 lg:px-12">
            <a href="{% url 'core:panel_control_auditor' %}" class="text-lg font-semibold tracking-tight text-slate-950">
                Panel de control
            </a>

            {% if user.is_authenticated %}
                <div class="flex items-center gap-3">
                    <p class="text-sm text-slate-600">
                        Usuario: <span class="font-medium text-slate-900">{{ user.username }}</span>
                    </p>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                            Cerrar sesi&oacute;n
                        </button>
                    </form>
                </div>
            {% else %}
                <div class="flex items-center gap-4">
                    <!-- <a href="{% url 'login' %}" class="text-sm font-medium text-slate-600 hover:text-slate-950">
                        Entrar
                    </a> -->
                    <a href="{% url 'clientes:registro' %}" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700">
                        Registrarse
                    </a>
                </div>
            {% endif %}
        </div>
    </header>

    <main class="mx-auto w-full px-6 py-10 lg:px-12">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
